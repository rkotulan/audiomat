[project]
name = "audiomat"
version = "0.0.0"
description = "Convert eBooks into audiobooks with cloned voices, locally and offline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "rkotulan" },
]
keywords = ["tts", "audiobook", "voice-cloning", "czech", "omnivoice", "epub"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/rkotulan/audiomat"
Issues   = "https://github.com/rkotulan/audiomat/issues"

# [project.scripts] — entry point added once audiomat/cli.py exists
# audiomat = "audiomat.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiomat*"]
